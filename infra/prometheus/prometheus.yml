# Prometheus raspa os três serviços pelo endpoint que o Actuator expõe.
#
# Os alvos usam o nome do serviço na rede Docker, não localhost: dentro da rede
# `ticketflow` o DNS do compose resolve `order-service` para o container.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:8080']
        labels:
          service: order-service

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8082']
        labels:
          service: payment-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8083']
        labels:
          service: notification-service

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
