apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ticketflow
  labels:
    app: order-service
    app.kubernetes.io/part-of: ticketflow
spec:
  # Duas réplicas de propósito: é o que exercita as decisões tomadas no código.
  # O relay do outbox usa FOR UPDATE SKIP LOCKED justamente para que duas
  # instâncias não publiquem a mesma mensagem, e o consumidor de pagamentos é
  # idempotente porque o rebalanceamento do Kafka pode reentregar.
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: order-service
          image: ticketflow/order-service:0.1.0
          # No Minikube a imagem é construída no daemon local, então não há de
          # onde puxar.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: ticketflow-secrets
          env:
            - name: POSTGRES_URL
              value: jdbc:postgresql://postgres:5432/ticketflow_orders
          # As três probes fazem trabalhos diferentes, e trocá-las causa estrago:
          # startup dá tempo ao boot sem afrouxar as outras, readiness tira do
          # balanceador sem matar, liveness reinicia.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ticketflow
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
