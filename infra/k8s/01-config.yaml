# Configuração compartilhada pelos três serviços.
#
# O que muda entre ambientes fica aqui, não na imagem: a mesma imagem que roda no
# compose roda aqui, só com variáveis diferentes. É o que torna o build promovível
# em vez de recompilado por ambiente.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-config
  namespace: ticketflow
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  KAFKA_BOOTSTRAP: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  POSTGRES_HOST: "postgres"
  MONGO_HOST: "mongo"
  TICKETFLOW_GATEWAY_BASE_URL: "http://payment-gateway:8080"
---
# Credenciais de DESENVOLVIMENTO, iguais às do .env.example.
#
# Um Secret do Kubernetes é apenas base64 — não é criptografia. Num ambiente real
# isto seria um External Secret, Sealed Secret ou Vault, e nunca estaria no
# repositório. Está aqui porque o objetivo é rodar no Minikube.
apiVersion: v1
kind: Secret
metadata:
  name: ticketflow-secrets
  namespace: ticketflow
type: Opaque
stringData:
  POSTGRES_USER: ticketflow
  POSTGRES_PASSWORD: ticketflow
  MONGO_USER: ticketflow
  MONGO_PASSWORD: ticketflow
  # Precisa existir: fora dos perfis `local` e `docker` esta variável não tem
  # valor padrão, e o serviço se recusa a subir sem ela. É deliberado — havia um
  # padrão publicado no repositório, e um ambiente que suba com a chave de
  # exemplo aceita token forjado por qualquer pessoa.
  #
  # O emissor de token de desenvolvimento fica desligado aqui: nenhum
  # TICKETFLOW_DEV_TOKENS é definido, e o padrão agora é `false`.
  TICKETFLOW_AUTH_SECRET: minikube-troque-isto-fora-do-minikube-32
