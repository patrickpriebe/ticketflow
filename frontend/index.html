<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TicketFlow — ingressos para shows, jogos e espetáculos." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TicketFlow · Ingressos para shows, jogos e espetáculos</title>

    <!--
      Inter, com fallback para a fonte do sistema. Se a rede não responder, a
      página continua legível na fonte da própria máquina — por isso `swap` e
      por isso a pilha de fallback no token --font-sans.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!--
      Sem `defer` e sem `type="module"`: os dois adiam a execução para depois do
      parse, que é exatamente o quadro claro que este script existe para evitar.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
