<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TicketFlow — ingressos para shows, jogos e espetáculos." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TicketFlow · Ingressos para shows, jogos e espetáculos</title>

    <!--
      As fontes moram aqui, não num CDN. É a mesma decisão já tomada para as
      fotos dos locais: `img-src 'self'`, e um cartão que perde a imagem porque
      um terceiro caiu é uma falha que não precisa existir. Vale mais ainda
      para a tipografia — sem ela a página inteira troca de letra.

      Só os dois arquivos do subset `latin` entram em `preload`: são os que toda
      visita pede. O `latin-ext` fica declarado no CSS e o navegador só o baixa
      se algum caractere do texto exigir. Se nada carregar, a pilha de fallback
      em --font-display / --font-sans mantém a página legível.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/big-shoulders-display-500-800-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans-400-700-latin.woff2"
      crossorigin
    />

    <!--
      Sem `defer` e sem `type="module"`: os dois adiam a execução para depois do
      parse, que é exatamente o quadro claro que este script existe para evitar.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
