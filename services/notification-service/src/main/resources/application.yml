spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://ticketflow:ticketflow@localhost:27017/ticketflow_notifications}
      auto-index-creation: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  cloud:
    function:
      # Two consumers: one builds the read model, the other acts on it.
      definition: orderCreated;paymentProcessed
    stream:
      bindings:
        orderCreated-in-0:
          destination: ticketflow.orders.created
          group: notification-service${TICKETFLOW_GROUP_SUFFIX:}
          consumer:
            max-attempts: 3
        paymentProcessed-in-0:
          destination: ticketflow.payments.processed
          group: notification-service${TICKETFLOW_GROUP_SUFFIX:}
          consumer:
            # A payment result can arrive before its order snapshot has been stored.
            # The partition key guarantees ordering *within* a topic, not across two
            # of them - these are separate topics read by separate consumers, so
            # nothing orders them relative to each other. In steady state the gap is
            # milliseconds; on a cold start replaying both topics it can be seconds,
            # which is what this retry window is sized for.
            max-attempts: 10
            back-off-initial-interval: 2000
            back-off-max-interval: 10000
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          auto-create-topics: false
        bindings:
          orderCreated-in-0:
            consumer:
              # Explicit, not inherited: a group joining without a committed offset
              # would otherwise start at the end and silently skip everything already
              # on the topic. For a service that issues tickets, a missed event is a
              # customer who paid and got nothing.
              start-offset: earliest
              enable-dlq: true
              dlq-name: ticketflow.orders.created.dlq
              # As DLQ tem UMA particao e os topicos de origem tem tres. Sem isto
              # o binder tenta escrever na mesma particao de onde leu, e uma
              # mensagem vinda da particao 1 ou 2 morre com "partition N is not
              # present in metadata" - a mensagem envenenada se perde justamente
              # no mecanismo que existe para nao perde-la.
              dlq-partitions: 1
          paymentProcessed-in-0:
            consumer:
              start-offset: earliest
              enable-dlq: true
              dlq-name: ticketflow.payments.processed.dlq
              # As DLQ tem UMA particao e os topicos de origem tem tres. Sem isto
              # o binder tenta escrever na mesma particao de onde leu, e uma
              # mensagem vinda da particao 1 ou 2 morre com "partition N is not
              # present in metadata" - a mensagem envenenada se perde justamente
              # no mecanismo que existe para nao perde-la.
              dlq-partitions: 1

ticketflow:
  auth:
    # As mesmas três linhas do Order Service, e precisam continuar iguais: os dois
    # são resource servers do mesmo emissor. Se um aceitasse o provedor e o outro
    # só o segredo local, o cliente compraria e não veria o ingresso.
    #
    # Nenhum valor aproveitável aqui — quem derruba o boot quando falta
    # configuração é o SecurityConfiguration, não o padrão do YAML.
    issuer-uri: ${TICKETFLOW_AUTH_ISSUER_URI:}
    audience: ${TICKETFLOW_AUTH_AUDIENCE:}
    secret: ${TICKETFLOW_AUTH_SECRET:}

  archive:
    # Desligado por padrão: o serviço tem que rodar sem AWS nenhuma, e ninguém
    # deveria precisar do LocalStack de pé só para ver um pedido passar.
    enabled: false
    bucket: ticketflow-tickets
    endpoint: ""
    region: us-east-1

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

---
# Kubernetes. Tudo vem do ConfigMap e do Secret.
spring:
  config:
    activate:
      on-profile: kubernetes
  data:
    mongodb:
      uri: ${MONGO_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://ticketflow:ticketflow@mongo:27017/ticketflow_notifications
  kafka:
    bootstrap-servers: kafka:19092

ticketflow:
  auth:
    # O compose é ambiente de demonstração: chave de brincadeira serve.
    secret: ${TICKETFLOW_AUTH_SECRET:desenvolvimento-local-troque-isto-em-producao}
  archive:
    # No compose o LocalStack faz o papel da AWS.
    enabled: ${TICKETFLOW_ARCHIVE_ENABLED:false}
    endpoint: http://localstack:4566
    bucket: ticketflow-tickets

---
# Nuvem gerenciada: MongoDB Atlas e Redpanda (Kafka).
#
# Sem valores padrão: variável ausente derruba o boot.
spring:
  config:
    activate:
      on-profile: cloud
  data:
    mongodb:
      # A URI do Atlas usa `mongodb+srv://` e já vem com TLS ligado. Ela carrega
      # usuário e senha, então é segredo inteiro — nunca literal neste arquivo.
      uri: ${MONGO_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

ticketflow:
  auth:
    # O mesmo provedor que o Order Service valida — trocaram juntos, como tinha
    # que ser: os dois olham para o mesmo emissor e para o mesmo client id.
    #
    # Padrões vazios pela mesma razão de lá: a pilha local apontando para a
    # nuvem roda com o emissor simétrico. Quem derruba o boot quando falta
    # configuração é o SecurityConfiguration, não o YAML.
    issuer-uri: ${TICKETFLOW_AUTH_ISSUER_URI:}
    audience: ${TICKETFLOW_AUTH_AUDIENCE:}
    secret: ${TICKETFLOW_AUTH_SECRET:}
  archive:
    # Desligado até existir um bucket de verdade. Ver a fase 6 do roadmap.
    enabled: ${TICKETFLOW_ARCHIVE_ENABLED:false}
