spring:
  application:
    name: payment-service

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: payment-service-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

  cloud:
    function:
      definition: orderCreated
    stream:
      bindings:
        orderCreated-in-0:
          destination: ticketflow.orders.created
          # O sufixo separa ambientes que compartilham o mesmo broker.
          #
          # Sem ele, a instância local e a publicada entram no MESMO grupo e o
          # Kafka divide as partições entre as duas: metade dos pedidos vai para
          # um ambiente, metade para o outro. Foi exatamente o que aconteceu — um
          # pedido criado na máquina de desenvolvimento foi processado pelo
          # serviço em produção, e o sintoma foi um pedido que nunca resolvia sem
          # nenhum erro do lado de quem testava.
          #
          # Com broker separado por ambiente isto não seria necessário; com um
          # cluster gratuito só, é o que mantém os dois sem se atrapalhar.
          group: payment-service${TICKETFLOW_GROUP_SUFFIX:}
          consumer:
            max-attempts: 3
            back-off-initial-interval: 2000
        paymentProcessed-out-0:
          destination: ticketflow.payments.processed
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          auto-create-topics: false
          required-acks: all
        bindings:
          orderCreated-in-0:
            consumer:
              enable-dlq: true
              dlq-name: ticketflow.orders.created.dlq

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

ticketflow:
  gateway:
    # `http` usa o gateway simulado; `stripe` usa o provedor de verdade. Os dois
    # implementam a mesma porta e o caso de uso não sabe a diferença.
    #
    # O padrão é o simulado de propósito: quem clona o repositório consegue rodar
    # o sistema inteiro sem ter conta em provedor nenhum.
    provider: ${TICKETFLOW_GATEWAY_PROVIDER:http}
    name: acme-payments
    base-url: http://localhost:8090
    connect-timeout: 2s
    # Deliberately short. A payment worker that waits a minute on a dead provider
    # just piles up unprocessed orders.
    read-timeout: 5s
  stripe:
    # Sem padrão: se o provedor for `stripe` e a chave faltar, o boot cai. Deixar
    # um valor vazio faria o serviço subir e só falhar na primeira cobrança.
    secret-key: ${STRIPE_SECRET_KEY:}
    # Sem ele o webhook não verifica assinatura e recusa tudo — que é o
    # comportamento certo, porque aceitar sem verificar é uma porta aberta para
    # forjar aprovação de pagamento.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Confirma o cartão na hora com um meio de pagamento fictício do Stripe, para
    # o ciclo fechar sem navegador. Vazio em produção: lá a confirmação acontece
    # no Stripe Elements e o cartão nunca passa por este serviço.
    test-card-payment-method: ${STRIPE_TEST_CARD:}

  outbox:
    poll-interval: 1000
    batch-size: 50
    max-attempts: 8
    output-binding: paymentProcessed-out-0

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/ticketflow_payments}
    # Overridable by environment. The fallbacks are the throwaway credentials from
    # .env.example - never commit a real one here.
    username: ${POSTGRES_USER:ticketflow}
    password: ${POSTGRES_PASSWORD:ticketflow}

---
# Kubernetes. Tudo vem do ConfigMap e do Secret, sem defaults: variável faltando
# tem que quebrar o boot, não conectar em algo inesperado.
spring:
  config:
    activate:
      on-profile: kubernetes
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

ticketflow:
  gateway:
    base-url: ${TICKETFLOW_GATEWAY_BASE_URL}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/ticketflow_payments
    username: ${POSTGRES_USER:ticketflow}
    password: ${POSTGRES_PASSWORD:ticketflow}
  kafka:
    bootstrap-servers: kafka:19092

ticketflow:
  gateway:
    base-url: http://payment-gateway:8080

---
# Nuvem gerenciada: Neon (Postgres) e Redpanda (Kafka).
#
# O Payment Service tem banco próprio, num provedor diferente do Order Service.
# Não é capricho: banco por serviço é o ponto, e o plano gratuito do Supabase só
# permite dois projetos ativos. Separar de verdade custou uma conta a mais e
# manteve a propriedade dos dados onde ela deve estar.
#
# Sem valores padrão: variável ausente derruba o boot.
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    # Neon exige TLS — a URL precisa carregar `?sslmode=require`.
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Mesma razão do Order Service: banco gerenciado gratuito tem teto baixo de
      # conexões, e duas instâncias com pool de dez cada estouram o limite. A que
      # subir depois morre no boot.
      maximum-pool-size: ${POSTGRES_POOL_SIZE:5}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

ticketflow:
  gateway:
    # Continua sendo o gateway simulado até a fase do Stripe. A troca é de URL e
    # de estratégia — o resto do serviço não sabe quem está do outro lado.
    base-url: ${TICKETFLOW_GATEWAY_BASE_URL}
