spring:
  application:
    name: order-service

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: order-service-pool
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema. `validate` makes the application refuse to start if
    # the entities and the migrations ever disagree - far better than `update`
    # quietly altering tables behind your back.
    hibernate:
      ddl-auto: validate
    # Lazy loading must not silently happen while rendering the HTTP response.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092

  cloud:
    function:
      # Only the consumer is declared. The producer side goes through StreamBridge,
      # because the relay sends when it has something to send.
      definition: paymentProcessed
    stream:
      bindings:
        orderCreated-out-0:
          destination: ticketflow.orders.created
        orderCancelled-out-0:
          destination: ticketflow.orders.cancelled
        paymentProcessed-in-0:
          destination: ticketflow.payments.processed
          # The consumer group is also the inbox key in processed_events.
          # Sufixo por ambiente: ver a nota no payment-service. Sem ele, a
          # instancia local e a publicada dividem as particoes entre si.
          group: order-service${TICKETFLOW_GROUP_SUFFIX:}
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          # Topics are infrastructure, created by infra/kafka/create-topics.sh.
          # A topic appearing by accident hides a typo instead of exposing it.
          auto-create-topics: false
          required-acks: all
        bindings:
          paymentProcessed-in-0:
            consumer:
              # A message that will never parse must not be retried forever.
              enable-dlq: true
              dlq-name: ticketflow.payments.processed.dlq
              # As DLQ tem UMA particao e os topicos de origem tem tres. Sem isto
              # o binder tenta escrever na mesma particao de onde leu, e uma
              # mensagem vinda da particao 1 ou 2 morre com "partition N is not
              # present in metadata" - a mensagem envenenada se perde justamente
              # no mecanismo que existe para nao perde-la.
              dlq-partitions: 1

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Stamped on every metric, so one Grafana panel can break a number down by
      # service without needing three separate queries.
      application: ${spring.application.name}
    distribution:
      # Sem isto o Micrometer publica só contagem e soma, e todo
      # `histogram_quantile` no Grafana devolve "No data" — foi exatamente o que
      # aconteceu: dois painéis de latência ficaram vazios desde que nasceram.
      #
      # Painel que nunca tem dado é pior que painel nenhum: ensina a ignorar o
      # dashboard, e aí o painel que importa também é ignorado.
      percentiles-histogram:
        http.server.requests: true
      # Os cortes que interessam para esta API. O POST /orders não espera o
      # pagamento, então centenas de milissegundos aqui já é sintoma.
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  # Contract-first: Swagger UI serves the hand-written document copied from
  # contracts/openapi at build time. Nothing is generated from annotations, so
  # the published contract cannot drift away from the designed one.
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    url: /order-service.yaml

ticketflow:
  auth:
    # Dois emissores possíveis, e exatamente um precisa estar configurado.
    #
    # Com `issuer-uri`, o serviço valida token de um provedor de identidade de
    # verdade — o Google, em produção — buscando a chave pública no JWKS dele.
    # É o caminho dos ambientes publicados.
    #
    # Sem ele, vale o segredo simétrico abaixo, que é o caminho local.
    #
    # Nenhum dos dois tem valor aproveitável aqui. O padrão vazio não é
    # relaxamento: quem garante que não dá para subir sem verificação é o
    # SecurityConfiguration, que derruba o boot se faltarem os dois — ou se
    # vier provedor sem audience. A chave de exemplo já esteve nesta linha, e
    # estar publicada no repositório torna trivial forjar token para qualquer
    # cliente.
    issuer-uri: ${TICKETFLOW_AUTH_ISSUER_URI:}
    # O client id da nossa aplicação no provedor. Obrigatório junto com o
    # issuer: o Google assina token para todo mundo, e sem comparar o `aud` um
    # token emitido para outro site entra aqui como login válido — com o `sub`
    # real da pessoa.
    audience: ${TICKETFLOW_AUTH_AUDIENCE:}
    secret: ${TICKETFLOW_AUTH_SECRET:}
    # Emite token sem verificar nada — qualquer pessoa, qualquer e-mail, sem senha.
    #
    # Desligado por padrão. Já foi `true` aqui, e significava que subir para
    # qualquer lugar sem lembrar da variável deixava um emissor de identidade
    # aberto na internet. O padrão de uma flag perigosa tem que ser o seguro:
    # esquecer passa a ser inofensivo em vez de catastrófico.
    dev-tokens: ${TICKETFLOW_DEV_TOKENS:false}

  order:
    # How long an order may sit in PENDING before the expiry sweep releases it.
    payment-window: PT15M
    expiry:
      enabled: true
      # Milliseconds between sweeps. Reserved inventory is only as fresh as this.
      interval: 60000
      batch-size: 100
  outbox:
    # Milliseconds between relay cycles.
    poll-interval: 1000
    batch-size: 50
    # After this many failed sends the message is parked as FAILED for inspection.
    max-attempts: 8
    # Tópico gravado na linha do outbox -> binding do Spring Cloud Stream. Um
    # tópico ausente daqui estoura no envio; é de propósito, porque a alternativa
    # é publicar no destino errado sem ninguém perceber.
    bindings: "{'ticketflow.orders.created': 'orderCreated-out-0', 'ticketflow.orders.cancelled': 'orderCancelled-out-0'}"

  retention:
    # Nem o outbox nem o inbox tinham limpeza, e as duas tabelas só cresciam.
    enabled: true
    # De hora em hora: o que se evita aqui é crescimento de meses, não de minutos.
    interval: 3600000
    initial-delay: 60000
    # Mensagem PUBLISHED já cumpriu o papel dela. PENDING e FAILED nunca saem.
    outbox: P7D
    # Precisa ser MAIOR que a retenção dos tópicos (7 dias): enquanto o Kafka
    # ainda puder reentregar, o registro que deduplica tem que existir.
    inbox: P30D
    batch-size: 500
    max-batches-per-cycle: 10

---
# Running from the IDE / `mvnw spring-boot:run` on Windows.
# Postgres is published on 5433 because 5432 is taken by a native install.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/ticketflow_orders}
    # Overridable by environment. The fallbacks are the throwaway credentials from
    # .env.example - never commit a real one here.
    username: ${POSTGRES_USER:ticketflow}
    password: ${POSTGRES_PASSWORD:ticketflow}
  flyway:
    # The demo catalogue is applied only here. It is deliberately outside the
    # default locations so it can never reach a real environment.
    locations: classpath:db/migration,classpath:db/seed

ticketflow:
  auth:
    # Chave de brincadeira e emissor aberto: na máquina de quem desenvolve não há
    # nada a proteger, e exigir um provedor de identidade de pé para rodar o
    # projeto seria atrito puro. Fora daqui os dois voltam a ser obrigatórios.
    secret: ${TICKETFLOW_AUTH_SECRET:desenvolvimento-local-troque-isto-em-producao}
    dev-tokens: ${TICKETFLOW_DEV_TOKENS:true}
  observability:
    # O Prometheus do compose raspa daqui. Fora do desenvolvimento a rota fica
    # fechada por padrão — ver o SecurityConfiguration para o que ela entrega.
    public-metrics: ${TICKETFLOW_OBSERVABILITY_PUBLIC_METRICS:true}

---
# Kubernetes. Everything comes from the ConfigMap and Secret - no defaults here on
# purpose: a missing variable must fail loudly at boot, not silently connect to
# something unintended.
spring:
  config:
    activate:
      on-profile: kubernetes
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
  flyway:
    locations: classpath:db/migration

---
# Running as a container inside the ticketflow compose network.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/ticketflow_orders
    username: ${POSTGRES_USER:ticketflow}
    password: ${POSTGRES_PASSWORD:ticketflow}
  kafka:
    # Inside the compose network the broker's internal listener is used.
    bootstrap-servers: kafka:19092
  flyway:
    locations: classpath:db/migration,classpath:db/seed

ticketflow:
  auth:
    # Mesma escolha do perfil `local`: o compose é ambiente de demonstração.
    secret: ${TICKETFLOW_AUTH_SECRET:desenvolvimento-local-troque-isto-em-producao}
    dev-tokens: ${TICKETFLOW_DEV_TOKENS:true}
  observability:
    # O Prometheus do compose raspa daqui. Fora do desenvolvimento a rota fica
    # fechada por padrão — ver o SecurityConfiguration para o que ela entrega.
    public-metrics: ${TICKETFLOW_OBSERVABILITY_PUBLIC_METRICS:true}

---
# Nuvem gerenciada: Supabase (Postgres) e Redpanda (Kafka).
#
# NENHUM valor padrão aqui, de propósito — a mesma regra do perfil `kubernetes`.
# Variável ausente derruba o boot, o que é muito melhor que subir apontando para
# algo não intencional ou com uma credencial de exemplo.
#
# Nada de segredo neste arquivo: ele vai para o GitHub. Os valores vivem no
# `.env` (ignorado pelo git) em desenvolvimento e no painel do provedor em
# produção.
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    # Supabase: usar o *session pooler* (porta 5432 no host pooler.supabase.com).
    #
    # A conexão direta `db.<ref>.supabase.co` só responde em IPv6, e o Render sai
    # por IPv4 — de lá ela simplesmente não conecta. O transaction pooler (6543)
    # resolveria o IPv4, mas roda o PgBouncer em modo transação, onde prepared
    # statements quebram e o Hibernate para de funcionar de um jeito que o erro
    # não denuncia. O session pooler é proxiado por IPv4 e mantém a sessão.
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # Cinco, não os dez do padrão local.
      #
      # O pooler do Supabase no plano gratuito aceita 15 conexões no total. Dez
      # por instância significa que a segunda instância a subir não consegue
      # abrir o pool e o serviço morre no boot, durante o Flyway — foi
      # exatamente assim que o primeiro deploy falhou, com a instância local
      # segurando as conexões.
      #
      # Cinco sobra para um serviço que faz transações curtas, e deixa espaço
      # para uma segunda instância e para quem estiver depurando pelo psql.
      maximum-pool-size: ${POSTGRES_POOL_SIZE:5}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";
  flyway:
    # Sem `db/seed`: o catálogo de demonstração não entra num ambiente publicado.
    # O caminho para cadastrar evento é administrativo, não migration.
    locations: classpath:db/migration

ticketflow:
  auth:
    # No Render, quem emite identidade é o Google e este serviço só valida:
    # `https://accounts.google.com`, de onde o decoder faz a descoberta OIDC e
    # pega a chave pública sozinho. O client id vai em `audience`.
    #
    # Os padrões vazios existem para o mesmo perfil servir à pilha local
    # apontando para a nuvem (`docker-compose.cloud.yml`), que roda com o
    # emissor simétrico enquanto se depura banco e Kafka. Não são um
    # relaxamento: faltando provedor E segredo, ou provedor sem audience, o
    # SecurityConfiguration derruba o boot — está em JwtDecoderSelectionTest.
    issuer-uri: ${TICKETFLOW_AUTH_ISSUER_URI:}
    audience: ${TICKETFLOW_AUTH_AUDIENCE:}
    secret: ${TICKETFLOW_AUTH_SECRET:}
    # O emissor de token sem senha nunca sobe aqui. O padrão da configuração base
    # já é `false`; esta linha existe para que a intenção fique escrita.
    dev-tokens: false
